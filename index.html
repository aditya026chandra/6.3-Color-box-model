
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Left Box (Teal with Text, 20px padding) -->
  <div class="box box1">
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
      Aliquam at sapien porttitor urna elementum lacinia. In id 
      magna pulvinar, ultricies lorem id, vehicula elit. 
      Aliquam eu luctus nisl, vitae pellentesque magna. Phasellus 
      dolor metus, laoreet ac convallis sit amet, efficitur sed dolor.
    </p>
  </div>

  <!-- Center-Right Box (Yellow with 20px top/bottom border and 10px left/right border) -->
  <div class="box box2"></div>

  <!-- Bottom Left Box (Red) -->
  <div class="box box3"></div>

</body>
</html>
